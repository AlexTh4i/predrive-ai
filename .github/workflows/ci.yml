name: PreDrive AI CI/CD

on:
  pull_request:
    branches: [main, hardening]
  push:
    branches: [main, hardening]

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend Pytest + Schema Verification (Postgres 15 & Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: predrive
          POSTGRES_PASSWORD: predrive_local_dev
          POSTGRES_DB: predrive
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U predrive -d predrive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client & verify supabase/schema.sql + seed.sql
        env:
          PGPASSWORD: predrive_local_dev
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql -h 127.0.0.1 -p 54329 -U predrive -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE predrive_ci_sql;"
          psql -h 127.0.0.1 -p 54329 -U predrive -d predrive_ci_sql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -h 127.0.0.1 -p 54329 -U predrive -d predrive_ci_sql -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Install Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite (SQLite + Postgres 15 + Redis 7)
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/backend"
          PREDRIVE_ENABLE_LEGACY_AI: "0"
          PREDRIVE_TEST_PG_ADMIN_URL: "postgresql+psycopg://predrive:predrive_local_dev@127.0.0.1:54329/postgres"
        run: |
          pytest backend/tests -v

  web-and-e2e-ci:
    name: Build Driver App + Admin Web & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & Build Driver App (frontend/)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Install, Build & Run Playwright E2E (admin-web/)
        working-directory: admin-web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm test

  cd-deploy:
    name: Build Images, Push GHCR & Deploy with Rollback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-ci, web-and-e2e-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/predrive-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/predrive-backend:latest

      - name: Build and push Admin Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/predrive-admin-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/predrive-admin-web:latest

      - name: Deploy over SSH with Healthcheck & Automatic Rollback
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NEW_TAG: ${{ github.sha }}
        run: |
          set +x
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH:-/opt/predrive-ai}"
          PREV_TAG=\$(cat .last_deployed_tag 2>/dev/null || echo "latest")
          echo "Deploying tag ${NEW_TAG} (previous=${PREV_TAG})..."
          export IMAGE_TAG="${NEW_TAG}"
          docker compose pull backend admin-web
          docker compose up -d backend admin-web caddy

          HEALTH_OK=0
          for i in \$(seq 1 15); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              HEALTH_OK=1
              break
            fi
            sleep 2
          done

          if [[ "\$HEALTH_OK" != "1" ]]; then
            echo "ERROR: Healthcheck failed for ${NEW_TAG}! Rolling back to \${PREV_TAG}..." >&2
            export IMAGE_TAG="\${PREV_TAG}"
            docker compose pull backend admin-web || true
            docker compose up -d backend admin-web caddy
            exit 1
          fi

          echo "${NEW_TAG}" > .last_deployed_tag
          echo "Deployment verified healthy at ${NEW_TAG}."
          EOF
